<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>ویرایشگر متن فارسی</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <!-- Font: Vazir -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/font-face.css" rel="stylesheet">
  <!-- Pickr Styles -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css" />
  <style>
    body {
      font-family: 'Vazir', sans-serif;
      direction: rtl;
      background-color: #212529;
      color: #fff;
    }

    #editor {
      min-height: 350px;
      background: #343a40;
      border: 1px solid #555;
      padding: 15px;
      border-radius: 8px;
      outline: none;
      color: #fff;
    }

    .toolbar button, .toolbar select {
      margin: 4px;
    }

    .form-select, .btn {
      background-color: #495057;
      color: #fff;
      border-color: #666;
    }

    .form-select option {
      background-color: #212529;
      color: #fff;
    }

    .status-bar {
      font-size: 0.9rem;
      margin-top: 10px;
      color: #ccc;
    }

    #alertContainer {
      position: fixed;
      top: 20px;
      right: 20px;
      left: 20px;
      z-index: 9999;
    }
  </style>
</head>
<body>

<div id="alertContainer" class="container"></div>

<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">✍️ ویرایشگر متن آنلاین</h4>
    <div class="d-flex gap-2">
      <a href="https://github.com/mmnosrati" target="_blank" class="btn btn-sm btn-outline-light">📁 درباره من</a>
    </div>
  </div>

  <div class="toolbar d-flex flex-wrap mb-3">
    <button class="btn btn-outline-primary btn-sm" onclick="execCmd('bold')">بولد</button>
    <button class="btn btn-outline-primary btn-sm" onclick="execCmd('italic')">ایتالیک</button>
    <button class="btn btn-outline-primary btn-sm" onclick="execCmd('underline')">زیرخط</button>
    <button class="btn btn-outline-secondary btn-sm" onclick="execCmd('justifyRight')">راست‌چین</button>
    <button class="btn btn-outline-secondary btn-sm" onclick="execCmd('justifyCenter')">وسط‌چین</button>
    <button class="btn btn-outline-secondary btn-sm" onclick="execCmd('justifyLeft')">چپ‌چین</button>
    <button class="btn btn-outline-success btn-sm" onclick="execCmd('insertOrderedList')">لیست شماره‌دار</button>
    <button class="btn btn-outline-success btn-sm" onclick="execCmd('insertUnorderedList')">لیست نقطه‌دار</button>
    <select class="form-select form-select-sm w-auto" onchange="execCmd('fontSize', this.value)">
      <option value="">اندازه</option>
      <option value="1">8</option>
      <option value="2">10</option>
      <option value="3">12</option>
      <option value="4">14</option>
      <option value="5">16</option>
      <option value="6">20</option>
      <option value="7">24</option>
    </select>
    <!-- Pickr container -->
    <div id="fontColorPicker" class="ms-2"></div>
    <button class="btn btn-outline-warning btn-sm" onclick="execCmd('undo')">بازگشت</button>
    <button class="btn btn-outline-warning btn-sm" onclick="execCmd('redo')">جلو</button>
    <button class="btn btn-outline-light btn-sm" onclick="copyToClipboard()">کپی</button>
    <button class="btn btn-outline-danger btn-sm" onclick="clearEditor()">پاک کردن</button>
    <button class="btn btn-outline-info btn-sm" onclick="loadContent()">بارگذاری حافظه</button>
    <button class="btn btn-outline-success btn-sm" onclick="downloadText()">دانلود فایل</button>
  </div>

  <div id="editor" contenteditable="true"></div>
  <div class="status-bar mt-2" id="statusBar">کلمات: 0 | کاراکتر: 0</div>

  <div class="input-group mt-3">
    <input type="file" class="form-control" id="fileInput" accept=".txt" onchange="loadFromFile()">
  </div>
</div>

<!-- Bootstrap + Pickr -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

<script>
  const editor = document.getElementById('editor');
  const statusBar = document.getElementById('statusBar');
  const alertContainer = document.getElementById('alertContainer');

  function execCmd(cmd, val = null) {
    document.execCommand(cmd, false, val);
    editor.focus();
    updateStatus();
  }

  function clearEditor() {
    editor.innerHTML = '';
    updateStatus();
    showAlert('محتوا پاک شد.', 'danger');
  }

  function copyToClipboard() {
    const range = document.createRange();
    range.selectNodeContents(editor);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    document.execCommand("copy");
    selection.removeAllRanges();
    showAlert('متن کپی شد.', 'success');
  }

  function loadContent() {
    const saved = localStorage.getItem("editorContent");
    if (saved) {
      editor.innerHTML = saved;
      updateStatus();
      showAlert('محتوا از حافظه بارگذاری شد.', 'info');
    } else {
      showAlert('محتوایی برای بارگذاری وجود ندارد.', 'warning');
    }
  }

  function downloadText() {
    const blob = new Blob([editor.innerText], { type: "text/plain;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "text.txt";
    link.click();
    showAlert('فایل متنی دانلود شد.', 'success');
  }

  function loadFromFile() {
    const fileInput = document.getElementById('fileInput');
    const file = fileInput.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
      editor.innerText = e.target.result;
      updateStatus();
      showAlert('فایل بارگذاری شد.', 'info');
    };
    reader.readAsText(file);
  }

  function updateStatus() {
    const text = editor.innerText.trim();
    const words = text.split(/\s+/).filter(w => w.length > 0).length;
    const chars = text.length;
    statusBar.innerText = `کلمات: ${words} | کاراکتر: ${chars}`;
  }

  function showAlert(message, type = 'info') {
    const alert = document.createElement('div');
    alert.className = `alert alert-${type} alert-dismissible fade show mt-2`;
    alert.role = 'alert';
    alert.innerHTML = `${message}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>`;
    alertContainer.appendChild(alert);
    setTimeout(() => {
      alert.classList.remove('show');
      alert.classList.add('hide');
      setTimeout(() => alert.remove(), 500);
    }, 4000);
  }

  editor.addEventListener('input', updateStatus);
  window.addEventListener('load', () => {
    editor.focus();
    updateStatus();
  });

  // Pickr setup
  const pickr = Pickr.create({
    el: '#fontColorPicker',
    theme: 'classic',
    default: '#ffffff',
    swatches: ['#ffffff', '#ff0000', '#00ff00', '#0000ff', '#ffff00'],
    components: {
      preview: true,
      opacity: true,
      hue: true,
      interaction: {
        hex: true,
        rgba: true,
        input: true,
        save: true
      }
    }
  });

  pickr.on('save', (color) => {
    const selectedColor = color.toHEXA().toString();
    execCmd('foreColor', selectedColor);
    pickr.hide();
  });
</script>

</body>
</html>
